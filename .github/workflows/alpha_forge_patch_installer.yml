name: AlphaForge Patch Installer

on:
  workflow_dispatch:
    inputs:
      patch_zip:
        description: "Nome esatto dello zip patch caricato nella root del repository"
        required: true
        default: "alpha_forge_next_patch.zip"
      run_beta_test:
        description: "Eseguire beta test dopo installazione"
        required: true
        type: boolean
        default: true
      run_full_update:
        description: "Eseguire aggiornamento completo dopo installazione"
        required: true
        type: boolean
        default: true
      remove_patch_zip:
        description: "Rimuovere lo zip patch dopo installazione"
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

concurrency:
  group: alphaforge-patch-installer
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  install-patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git
        run: |
          git config user.name "alphaforge-patch-bot"
          git config user.email "alphaforge-patch-bot@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check patch token
        env:
          PATCH_TOKEN: ${{ secrets.ALPHAFORGE_PATCH_TOKEN }}
        run: |
          if [ -z "$PATCH_TOKEN" ]; then
            echo "ERROR: ALPHAFORGE_PATCH_TOKEN non è configurato nei repository secrets."
            echo "Vai su Settings > Secrets and variables > Actions e crea il secret ALPHAFORGE_PATCH_TOKEN."
            exit 1
          fi
          echo "Patch token found."

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Apply patch
        run: |
          PATCH_ZIP="${{ github.event.inputs.patch_zip }}"

          if [ ! -f "$PATCH_ZIP" ]; then
            echo "ERROR: patch zip not found: $PATCH_ZIP"
            echo "Upload the zip file in the repository root, then run this workflow again."
            exit 1
          fi

          rm -rf /tmp/alphaforge_patch
          mkdir -p /tmp/alphaforge_patch
          unzip -o "$PATCH_ZIP" -d /tmp/alphaforge_patch

          shopt -s dotglob nullglob

          PATCH_DIR="/tmp/alphaforge_patch"
          ITEMS=(/tmp/alphaforge_patch/*)

          if [ "${#ITEMS[@]}" -eq 1 ] && [ -d "${ITEMS[0]}" ]; then
            PATCH_DIR="${ITEMS[0]}"
          fi

          echo "Applying patch from: $PATCH_DIR"
          cp -a "$PATCH_DIR"/. .

          if [ "${{ github.event.inputs.remove_patch_zip }}" = "true" ]; then
            rm -f "$PATCH_ZIP"
          fi

          find . -name "*.pyc" -delete
          rm -rf __pycache__
          rm -rf .pytest_cache

      - name: Run full update
        if: ${{ github.event.inputs.run_full_update == 'true' }}
        run: |
          if [ -f auto_update_app.py ]; then
            python auto_update_app.py
          else
            echo "auto_update_app.py not found, skipping full update"
          fi

      - name: Run beta test
        if: ${{ github.event.inputs.run_beta_test == 'true' }}
        run: |
          if [ -f beta_test_app.py ]; then
            RUN_FULL_UPDATE="${{ github.event.inputs.run_full_update }}" python beta_test_app.py
          else
            echo "beta_test_app.py not found, skipping beta test"
          fi

      - name: Commit and push patch
        env:
          PATCH_TOKEN: ${{ secrets.ALPHAFORGE_PATCH_TOKEN }}
        run: |
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Apply AlphaForge patch: ${{ github.event.inputs.patch_zip }}"
            git remote set-url origin "https://x-access-token:${PATCH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
