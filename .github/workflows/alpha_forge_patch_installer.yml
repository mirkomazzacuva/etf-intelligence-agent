name: AlphaForge Patch Installer

on:
  workflow_dispatch:
    inputs:
      patch_zip:
        description: "Nome del file ZIP patch caricato nella root del repository"
        required: true
        default: "alpha_forge_next_patch.zip"
      run_beta_test:
        description: "Esegui beta test dopo installazione"
        required: true
        type: choice
        options:
          - "true"
          - "false"
        default: "true"
      run_full_update:
        description: "Esegui anche aggiornamento completo dati nel beta test"
        required: true
        type: choice
        options:
          - "false"
          - "true"
        default: "false"
      remove_patch_zip:
        description: "Elimina lo ZIP patch dopo installazione"
        required: true
        type: choice
        options:
          - "true"
          - "false"
        default: "true"

permissions:
  contents: write
  actions: read

concurrency:
  group: alphaforge-patch-installer
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  install-patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with patch token
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.ALPHAFORGE_PATCH_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "alphaforge-patch-bot"
          git config user.email "alphaforge-patch-bot@users.noreply.github.com"

      - name: Validate patch token
        run: |
          if [ -z "${{ secrets.ALPHAFORGE_PATCH_TOKEN }}" ]; then
            echo "ERROR: missing repository secret ALPHAFORGE_PATCH_TOKEN"
            exit 1
          fi

      - name: Apply patch zip
        run: |
          PATCH_ZIP="${{ inputs.patch_zip }}"

          if [ ! -f "$PATCH_ZIP" ]; then
            echo "ERROR: patch zip not found: $PATCH_ZIP"
            echo "Upload the zip file in the repository root, then run this workflow again."
            exit 1
          fi

          rm -rf /tmp/alphaforge_patch
          mkdir -p /tmp/alphaforge_patch
          unzip -o "$PATCH_ZIP" -d /tmp/alphaforge_patch

          PATCH_ROOT="/tmp/alphaforge_patch"
          ITEM_COUNT=$(find "$PATCH_ROOT" -mindepth 1 -maxdepth 1 | wc -l)
          FIRST_ITEM=$(find "$PATCH_ROOT" -mindepth 1 -maxdepth 1 | head -n 1)

          if [ "$ITEM_COUNT" -eq 1 ] && [ -d "$FIRST_ITEM" ]; then
            PATCH_ROOT="$FIRST_ITEM"
          fi

          echo "Applying patch from: $PATCH_ROOT"
          shopt -s dotglob nullglob
          cp -a "$PATCH_ROOT"/. .

          # Cleanup generated/cache files that should not stay in repository.
          find . -name "*.pyc" -delete
          find . -type d -name "__pycache__" -prune -exec rm -rf {} +
          rm -rf .pytest_cache
          rm -rf logs

          if [ "${{ inputs.remove_patch_zip }}" = "true" ]; then
            rm -f "$PATCH_ZIP"
          fi

          echo "Changed files after patch:"
          git status --short

      - name: Set up Python
        if: ${{ inputs.run_beta_test == 'true' }}
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: ${{ inputs.run_beta_test == 'true' }}
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run beta test
        if: ${{ inputs.run_beta_test == 'true' }}
        run: |
          if [ ! -f beta_test_app.py ]; then
            echo "ERROR: beta_test_app.py not found after patch"
            exit 1
          fi

          if [ "${{ inputs.run_full_update }}" = "true" ]; then
            python beta_test_app.py --full-update
          else
            python beta_test_app.py
          fi

       - name: Commit and push patch
        run: |
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Apply AlphaForge patch"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
