name: Beta test ETF Intelligence App

on:
  workflow_dispatch:
    inputs:
      run_full_update:
        description: "Esegui anche aggiornamento completo dati"
        required: true
        type: choice
        options:
          - "false"
          - "true"
        default: "false"
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  schedule:
    - cron: "15 7 * * 1-5"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  beta-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run beta test
        run: |
          if [ "${{ github.event.inputs.run_full_update }}" = "true" ]; then
            python beta_test_app.py --full-update
          else
            python beta_test_app.py
          fi

      - name: Upload beta test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-test-report
          path: |
            BETA_TEST_REPORT.md
            BETA_TEST_STATUS.json
            streamlit_smoke.log
            BETA_FULL_UPDATE.log
          if-no-files-found: ignore
