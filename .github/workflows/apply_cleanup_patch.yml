name: Apply cleanup patch safe

on:
  workflow_dispatch:
    inputs:
      patch_zip:
        description: "Nome del file zip da applicare. Lascia vuoto per fare solo pulizia."
        required: false
        default: ""
      remove_patch_zips:
        description: "Rimuovere gli zip delle patch dopo la pulizia?"
        required: true
        default: "true"

permissions:
  contents: write

jobs:
  apply-cleanup-patch-safe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "actions-user"
          git config user.email "actions@github.com"

      - name: Apply selected patch if provided
        run: |
          PATCH_ZIP="${{ github.event.inputs.patch_zip }}"

          if [ -z "$PATCH_ZIP" ]; then
            echo "No patch zip provided. Cleanup only."
          else
            echo "Patch zip selected: $PATCH_ZIP"

            if [ ! -f "$PATCH_ZIP" ]; then
              echo "ERROR: $PATCH_ZIP not found in repository root"
              exit 1
            fi

            mkdir -p /tmp/cleanup_patch
            unzip -o "$PATCH_ZIP" -d /tmp/cleanup_patch

            FIRST_DIR="$(find /tmp/cleanup_patch -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            FILE_COUNT="$(find /tmp/cleanup_patch -mindepth 1 -maxdepth 1 | wc -l)"

            if [ "$FILE_COUNT" = "1" ] && [ -n "$FIRST_DIR" ]; then
              PATCH_DIR="$FIRST_DIR"
            else
              PATCH_DIR="/tmp/cleanup_patch"
            fi

            echo "Using patch directory: $PATCH_DIR"

            shopt -s dotglob

            for item in "$PATCH_DIR"/*; do
              base="$(basename "$item")"

              if [ "$base" = ".git" ]; then
                echo "Skipping .git"
                continue
              fi

              if [ "$base" = ".github" ]; then
                echo "Skipping .github/workflows to avoid breaking workflows"

                mkdir -p .github

                for github_item in "$item"/*; do
                  github_base="$(basename "$github_item")"

                  if [ "$github_base" = "workflows" ]; then
                    echo "Skipping workflows folder"
                    continue
                  fi

                  cp -a "$github_item" .github/
                done

                continue
              fi

              cp -a "$item" .
            done
          fi

      - name: Clean repository
        run: |
          echo "Cleaning useless files..."

          rm -f ETF_AI_AGENT_FREE.zip

          if [ "${{ github.event.inputs.remove_patch_zips }}" = "true" ]; then
            rm -f alpha_forge_*.zip
          fi

          find . -name "*.pyc" -delete
          find . -name "__pycache__" -type d -prune -exec rm -rf {} +
          rm -rf logs
          rm -rf .pytest_cache

          git status --short

      - name: Commit cleanup
        run: |
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Apply universal cleanup"

            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
