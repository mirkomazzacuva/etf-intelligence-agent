name: Apply cleanup patch safe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-cleanup-patch-safe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure git
        run: |
          git config user.name "actions-user"
          git config user.email "actions@github.com"

      - name: Apply cleanup patch without touching workflows
        run: |
          if [ ! -f alpha_forge_repo_cleanup_patch.zip ]; then
            echo "ERROR: alpha_forge_repo_cleanup_patch.zip not found in repository root"
            exit 1
          fi

          mkdir -p /tmp/cleanup_patch
          unzip -o alpha_forge_repo_cleanup_patch.zip -d /tmp/cleanup_patch

          if [ -d "/tmp/cleanup_patch/alpha_forge_repo_cleanup_patch" ]; then
            PATCH_DIR="/tmp/cleanup_patch/alpha_forge_repo_cleanup_patch"
          else
            PATCH_DIR="/tmp/cleanup_patch"
          fi

          # Copy only non-workflow files
          cp -f "$PATCH_DIR/.gitignore" . 2>/dev/null || true
          cp -f "$PATCH_DIR/auto_update_app.py" . 2>/dev/null || true
          cp -f "$PATCH_DIR/beta_test_app.py" . 2>/dev/null || true
          cp -f "$PATCH_DIR/streamlit_app.py" . 2>/dev/null || true
          cp -f "$PATCH_DIR/README_BETA_TEST.md" . 2>/dev/null || true
          cp -f "$PATCH_DIR/README_REPO_CLEANUP.md" . 2>/dev/null || true

          # Remove useless files
          rm -f ETF_AI_AGENT_FREE.zip
          rm -f alpha_forge_auto_updates.zip
          rm -f alpha_forge_repo_cleanup_patch.zip
          rm -f beta_test_app.cpython-313.pyc
          find . -name "*.pyc" -delete
          rm -rf logs
          rm -rf __pycache__
          rm -rf .pytest_cache

          git status --short

      - name: Commit cleanup
        run: |
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Apply safe cleanup patch"
            git push
          fi
