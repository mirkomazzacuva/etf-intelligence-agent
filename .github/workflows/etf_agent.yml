name: Auto update ETF Intelligence App

on:
  schedule:
    # GitHub Actions usa orario UTC.
    # 18:30 UTC = 20:30 in Italia con ora legale, 19:30 con ora solare.
    # Scelto dopo la chiusura dei mercati europei per avere dati più stabili.
    - cron: "30 18 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: etf-intelligence-auto-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automatic update
        run: |
          python auto_update_app.py

      - name: Commit updated app files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ETF_Intelligence_Agent_UPDATED.xlsx ETF_Allocation_Model.xlsx ETF_Daily_Report.txt index.html AUTO_UPDATE_STATUS.json logs/update_log.jsonl
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Auto update ETF intelligence data"
          git push
