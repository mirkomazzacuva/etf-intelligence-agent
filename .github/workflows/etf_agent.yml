name: Auto update ETF Intelligence App

on:
  schedule:
    - cron: "30 18 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automatic update
        run: |
          python auto_update_app.py

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit updated app outputs
        run: |
          git add AUTO_UPDATE_STATUS.json || true
          git add ETF_Intelligence_Agent_UPDATED.xlsx || true
          git add ETF_Allocation_Model.xlsx || true
          git add ETF_Daily_Report.txt || true
          git add index.html || true
          git add AlphaForge_Watchlist.xlsx || true
          git add AlphaForge_Watchlist.csv || true
          git add AlphaForge_Insights.xlsx || true
          git add AlphaForge_Insights.csv || true
          git add data/watchlist.csv || true

          if git diff --cached --quiet; then
            echo "No updated files to commit"
          else
            git commit -m "Auto update AlphaForge data"
            git push
          fi
